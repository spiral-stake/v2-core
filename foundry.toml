[profile.default]
src = "src"
out = "abi"
libs = ["lib"]
remappings = [
    "@openzeppelin=lib/openzeppelin-contracts",
    "@chainlink=lib/chainlink",
    "@morpho=lib/morpho-blue/src",
    "@morpho-public-allocator=lib/public-allocator/src"
]
fs_permissions = [{ access = "write", path = "../" }, { access = "read", path = "lib/morpho-blue/out" }]
solc_version = "0.8.30"
gas_reports = ["*"]
ffi = true
optimizer = true
optimizer_runs = 200


# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
